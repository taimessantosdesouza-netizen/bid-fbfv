<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BID — Boletim Informativo Diário | FBFV</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="bid-header">
    <div class="bid-header-inner">
      <a class="bid-logo" id="logoHomeBtn" href="index.html" title="Início do BID FBFV">
        <svg width="42" height="48" viewBox="0 0 90 105" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 24H72V58C72 78 45 94 45 94C45 94 18 78 18 58V24Z" fill="#00237d" stroke="#ffd000" stroke-width="3"/>
          <path d="M45 27L67 54L45 86L23 54L45 27Z" fill="#009c3b"/>
          <path d="M45 33L61 54L45 79L29 54L45 33Z" fill="#ffd000"/>
          <rect x="25" y="47" width="40" height="14" rx="2" fill="#ffffff"/>
          <text x="45" y="57.5" text-anchor="middle" fill="#00237d" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="11">FBFV</text>
        </svg>
        <span class="bid-logo-text">BID</span>
      </a>

      <form class="bid-filter-pills" id="topFilterForm">
        <input
          id="filterDate"
          class="pill-input pill-date"
          type="date"
          aria-label="Data da publicação"
        />

        <select id="filterUf" class="pill-input pill-uf" aria-label="Estado (UF)">
          <option value="">UF</option>
          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>
        </select>

        <select id="filterClub" class="pill-input pill-club" aria-label="Clube">
          <option value="">Clube</option>
        </select>

        <button class="btn-search-circle" type="submit" title="Pesquisar registros" aria-label="Pesquisar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>

      <a class="header-admin-link" href="admin.html">Painel Admin</a>
    </div>
  </header>

  <main>
    <section id="emptyHome" class="empty-home">
      <svg width="76" height="88" viewBox="0 0 90 105" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 24H72V58C72 78 45 94 45 94C45 94 18 78 18 58V24Z" fill="#00237d" stroke="#ffd000" stroke-width="3"/>
        <path d="M45 27L67 54L45 86L23 54L45 27Z" fill="#009c3b"/>
        <path d="M45 33L61 54L45 79L29 54L45 33Z" fill="#ffd000"/>
        <rect x="25" y="47" width="40" height="14" rx="2" fill="#ffffff"/>
        <text x="45" y="57.5" text-anchor="middle" fill="#00237d" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="11">FBFV</text>
      </svg>

      <h1>Selecione os filtros para visualizar os resultados</h1>
      <p class="empty-home-sub">Utilize a data, UF, clube ou pesquise pelo nome ou inscrição do atleta.</p>
      <button id="btnShowLatest" class="btn-show-latest" type="button">
        Exibir todas as publicações recentes
      </button>
    </section>

    <section id="resultsWrapper" class="results-wrapper hidden">
      <div class="results-toolbar">
        <div id="resultsCount" class="results-count">
          Exibindo <strong>0</strong> resultados
        </div>

        <div class="name-search-box">
          <input
            id="filterName"
            class="name-search-input"
            type="search"
            placeholder="Pesquise pelo nome ou inscrição do atleta"
            aria-label="Pesquise pelo nome ou inscrição do atleta"
          />
        </div>
      </div>

      <div id="bidCardsGrid" class="bid-cards-grid"></div>
    </section>
  </main>

  <div id="historyModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="historyModalTitle">Histórico do Atleta</h3>
        <button id="closeHistoryModal" class="modal-close" type="button" aria-label="Fechar">✕</button>
      </div>
      <div id="historyModalBody"></div>
    </div>
  </div>

  <footer class="bid-footer">
    <div class="bid-footer-inner">
      <div class="creator-credit">
        <svg
          class="creator-logo-svg"
          width="54"
          height="54"
          viewBox="0 0 120 120"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="EL Sistema"
        >
          <defs>
            <linearGradient id="elGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#39ff14" />
              <stop offset="100%" stop-color="#00b82e" />
            </linearGradient>
            <linearGradient id="elSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#cbd5e1" />
            </linearGradient>
          </defs>

          <circle cx="60" cy="60" r="56" fill="#050706" stroke="url(#elGreenGrad)" stroke-width="4" />

          <path
            d="M46 42 C68 24, 98 28, 94 52 C92 60, 86 65, 80 68 C84 62, 86 55, 84 48 C81 35, 62 34, 46 42 Z"
            fill="url(#elSilverGrad)"
          />
          <path
            d="M52 38 C72 25, 95 30, 91 50 C88 41, 72 34, 52 38 Z"
            fill="url(#elGreenGrad)"
          />

          <path
            d="M24 76 C36 96, 74 96, 94 74 C76 89, 44 90, 28 73 Z"
            fill="url(#elGreenGrad)"
          />
          <path
            d="M28 79 C42 93, 72 92, 90 76 C73 87, 46 87, 28 79 Z"
            fill="url(#elSilverGrad)"
            opacity="0.9"
          />

          <text
            x="60"
            y="67"
            text-anchor="middle"
            font-family="Inter, Arial, sans-serif"
            font-style="italic"
            font-weight="900"
            font-size="22"
            letter-spacing="-0.6"
          >
            <tspan fill="url(#elGreenGrad)">EL</tspan>
            <tspan fill="url(#elSilverGrad)">Sistema</tspan>
          </text>
        </svg>

        <div class="creator-text">
          <span class="creator-label">Desenvolvido por</span>
          <strong class="creator-name">EL Sistema</strong>
        </div>
      </div>

      <p class="footer-copy">BID FBFV — Federação Brasileira de Futebol Virtual</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
